<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>A Distant Plain — Card Viewer</title>
  <style>
    :root { --paper:#e7dcc0; --paper-light:#f5eedc; --ink:#29231c; --muted:#786e60; --brown:#86582e; --blue:#207db6; --green:#2d9f5d; --black:#292b2c; --dark-action:#6a563a; --shadow:0 16px 38px rgba(0,0,0,.27); --nav-height:72px; }
    * { box-sizing:border-box; } body { min-width:320px; min-height:100svh; margin:0; padding:0 0 calc(var(--nav-height) + env(safe-area-inset-bottom)); color:var(--ink); font-family:Georgia,"Times New Roman",serif; background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.1),transparent 35%),linear-gradient(145deg,#29241e,#12110f 75%); } body.modal-open { overflow:hidden; }
    .app { width:min(100%,980px); margin:0 auto; padding:clamp(10px,2.5vw,26px) clamp(10px,3vw,28px) 0; }.card-viewport { position:relative; overflow:hidden; width:min(100%,690px); margin:0 auto; touch-action:pan-y; }.card-track { display:flex; width:200%; transition:transform .22s ease-out; will-change:transform; }.card-panel { width:50%; flex:0 0 50%; padding:0 1px 0 0; }.card-panel + .card-panel { padding:0 0 0 1px; }
    .card { position:relative; overflow:hidden; min-height:0; padding:clamp(18px,4vw,34px); border:1px solid rgba(83,66,41,.55); border-radius:12px; box-shadow:var(--shadow); background:repeating-linear-gradient(18deg,rgba(101,79,45,.035) 0 1px,transparent 1px 5px),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.7),transparent 62%),var(--paper); }.card::before,.card::after { content:""; position:absolute; pointer-events:none; inset:9px; border:1px solid rgba(112,85,48,.18); border-radius:7px; }.card::after { inset:auto 0 0; height:20%; border:0; border-radius:0; background:linear-gradient(transparent,rgba(95,65,30,.08)); }.card-header,.actions { position:relative; z-index:1; }
    .meta { display:flex; align-items:center; justify-content:space-between; min-height:42px; }.icons { display:flex; gap:clamp(7px,1.8vw,11px); align-items:center; justify-content:flex-start; }.icon { width:clamp(28px,7vw,42px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; border:3px solid rgba(255,255,255,.55); box-shadow:inset 0 0 0 2px rgba(0,0,0,.22),0 2px 5px rgba(0,0,0,.25); color:rgba(255,255,255,.88); font-family:system-ui,sans-serif; font-size:clamp(.65rem,1.8vw,.85rem); font-weight:800; text-shadow:0 1px 1px rgba(0,0,0,.45); }.icon-C { background:var(--brown); }.icon-G { background:var(--blue); }.icon-W { background:var(--green); }.icon-T { background:var(--black); }.number-area { display:flex; align-items:center; gap:7px; }.number { color:#4a4035; font-family:system-ui,sans-serif; font-size:clamp(2rem,6.4vw,3.35rem); font-weight:800; line-height:.9; letter-spacing:-.07em; }.help-button { width:30px; min-width:30px; height:30px; min-height:30px; padding:0; border:1px solid rgba(70,56,36,.36); border-radius:50%; color:#463724; background:rgba(126,103,64,.14); font-family:Georgia,serif; font-size:1.02rem; font-weight:700; line-height:1; }.help-button:hover { background:rgba(126,103,64,.25); }
    .title-row { display:flex; justify-content:center; margin:clamp(16px,3vw,25px) 0 clamp(18px,3.4vw,28px); }.title-row h1 { margin:0; text-align:center; font-size:clamp(1.55rem,5.2vw,3rem); line-height:1.04; letter-spacing:-.025em; }.actions { display:grid; gap:13px; }.action { padding:clamp(15px,3.5vw,24px) clamp(14px,3.6vw,28px); border:1px solid rgba(112,83,45,.2); border-radius:8px; text-align:center; background:rgba(126,103,64,.12); }.action.second { background:var(--dark-action); color:#faf1df; }.action-name { display:block; margin:0 0 7px; font-size:clamp(.88rem,2.2vw,1.06rem); font-style:italic; font-weight:700; line-height:1.25; }.action-text { margin:0; font-size:clamp(.98rem,2.6vw,1.28rem); line-height:1.36; }.empty-state { color:var(--muted); font-style:italic; }.action.second .empty-state { color:#dfd1b8; }.additional-info { display:none; position:relative; z-index:3; justify-self:center; width:fit-content; max-width:90%; margin:2px 0; padding:5px 13px 6px; border:1px solid rgba(54,42,25,.38); border-radius:999px; color:#f8eedc; background:#473a28; font-family:system-ui,sans-serif; font-size:clamp(.68rem,2vw,.84rem); font-weight:750; letter-spacing:.045em; text-align:center; text-transform:uppercase; }.additional-info.visible { display:block; }
    .navigation-shell { position:fixed; z-index:6; inset:auto 0 0; min-height:var(--nav-height); padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); border-top:1px solid rgba(241,227,201,.16); background:linear-gradient(to bottom,rgba(19,17,14,.88),rgba(12,11,9,.97)); backdrop-filter:blur(9px); }.navigation { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; width:min(100%,690px); margin:0 auto; }.nav-side { display:flex; gap:8px; }.nav-side.right { justify-content:flex-end; }button { appearance:none; cursor:pointer; min-height:44px; border:1px solid rgba(241,227,201,.36); border-radius:9px; padding:0 13px; color:#f8f2e7; background:rgba(255,255,255,.08); font-family:system-ui,sans-serif; font-size:.92rem; font-weight:700; transition:transform .15s ease,background .15s ease; }button:hover { background:rgba(255,255,255,.17); }button:active { transform:translateY(1px) scale(.98); }button:focus-visible { outline:3px solid #f3bf77; outline-offset:3px; }.arrow { min-width:64px; font-size:1.45rem; line-height:1; }.language-switch { justify-self:center; display:inline-flex; padding:3px; border:1px solid rgba(241,227,201,.34); border-radius:999px; background:rgba(0,0,0,.18); }.language-switch button { min-height:30px; border:0; border-radius:999px; padding:0 12px; color:#d5c7af; background:transparent; font-size:.72rem; }.language-switch button.active { color:#271f16; background:#f2e9d8; }
    .error { width:min(100%,690px); margin:auto; padding:28px; border:1px solid rgba(152,52,35,.55); border-radius:10px; background:#f5e0d3; color:#5c2118; text-align:center; font-family:system-ui,sans-serif; line-height:1.5; }.error code { font-family:ui-monospace,monospace; }.modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:18px; background:rgba(11,10,8,.72); opacity:0; pointer-events:none; transition:opacity .18s ease; }.modal.open { opacity:1; pointer-events:auto; }.modal-dialog { position:relative; width:min(100%,720px); max-height:min(82svh,780px); overflow:auto; padding:clamp(24px,5vw,42px); border:1px solid rgba(111,83,44,.45); border-radius:12px; background:var(--paper-light); box-shadow:0 25px 70px rgba(0,0,0,.45); }.modal-dialog::before { content:""; position:absolute; inset:9px; border:1px solid rgba(112,85,48,.16); border-radius:7px; pointer-events:none; }.modal-close { position:absolute; z-index:1; top:14px; right:14px; min-height:35px; width:35px; padding:0; border-color:rgba(70,56,36,.35); color:var(--ink); background:rgba(126,103,64,.12); font-size:1.25rem; }.modal h2 { position:relative; margin:0 38px 18px 0; font-size:clamp(1.45rem,4vw,2rem); line-height:1.12; }.fluff-content { position:relative; white-space:pre-line; font-size:clamp(1rem,2.6vw,1.22rem); line-height:1.55; }.fluff-empty { position:relative; color:var(--muted); font-style:italic; }
    @media(max-width:480px) { :root { --nav-height:66px; }.app { padding:8px 8px 0; }.card { padding:16px 15px 18px; border-radius:9px; }.meta { min-height:38px; }.icons { gap:6px; }.number-area { gap:5px; }.number { font-size:1.95rem; }.help-button { width:28px; min-width:28px; height:28px; min-height:28px; font-size:.98rem; }.title-row { margin:16px 0 17px; }.actions { gap:12px; }.navigation { gap:3px; width:100%; }.nav-side { gap:3px; }.navigation-shell { padding-inline:6px; }.navigation button { min-height:40px; padding:0 6px; font-size:.74rem; }.navigation .arrow { min-width:38px; font-size:1.22rem; }.navigation .jump { display:inline-flex; align-items:center; justify-content:center; min-width:39px; }.language-switch { padding:2px; }.language-switch button { min-height:28px; padding:0 8px; font-size:.67rem; } } @media(max-width:350px) { .navigation { gap:2px; }.nav-side { gap:2px; }.navigation-shell { padding-inline:4px; }.navigation button { min-height:38px; padding:0 4px; font-size:.68rem; }.navigation .arrow { min-width:34px; }.navigation .jump { min-width:36px; }.language-switch button { padding:0 7px; font-size:.64rem; } }
  </style>
</head>
<body>
  <main class="app"><div class="card-viewport" id="cardViewport" aria-label="Dwa panele kart, przesuń w lewo lub prawo aby przełączyć"><div class="card-track" id="cardTrack"><div class="card-panel"><article class="card" id="card0" aria-labelledby="title0"></article></div><div class="card-panel"><article class="card" id="card1" aria-labelledby="title1"></article></div></div></div></main>
  <div class="navigation-shell"><nav class="navigation" aria-label="Nawigacja kart"><div class="nav-side"><button class="jump" type="button" id="prev10">−10</button><button class="arrow" type="button" id="prev" aria-label="Poprzednia karta">←</button></div><div class="language-switch" aria-label="Język"><button type="button" data-lang="pl">PL</button><button type="button" data-lang="en">EN</button></div><div class="nav-side right"><button class="arrow" type="button" id="next" aria-label="Następna karta">→</button><button class="jump" type="button" id="next10">+10</button></div></nav></div>
  <section class="modal" id="fluffModal" role="dialog" aria-modal="true" aria-labelledby="fluffTitle" aria-hidden="true"><div class="modal-dialog"><button class="modal-close" type="button" id="closeFluff" aria-label="Zamknij">×</button><h2 id="fluffTitle"></h2><div class="fluff-content" id="fluffContent"></div></div></section>
  <script>
    const STORAGE_KEY='adp-card-viewer-v10';
    const defaultLanguage=(navigator.language||navigator.userLanguage||'pl').toLowerCase().startsWith('pl')?'pl':'en';
    let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){}
    const state={cards:[],activePanel:Number.isInteger(saved.activePanel)?Math.min(1,Math.max(0,saved.activePanel)):0,indices:Array.isArray(saved.indices)&&saved.indices.length===2?saved.indices:[0,1],lang:saved.lang==='pl'||saved.lang==='en'?saved.lang:defaultLanguage};
    const iconNames={C:'Brązowa',G:'Niebieska',W:'Zielona',T:'Czarna'};const viewport=document.querySelector('#cardViewport'),track=document.querySelector('#cardTrack'),modal=document.querySelector('#fluffModal'),fluffTitle=document.querySelector('#fluffTitle'),fluffContent=document.querySelector('#fluffContent');
    function localized(value){if(!value)return '';if(typeof value==='string')return value;return value[state.lang]||value.pl||value.en||'';}function wrap(index){return((index%state.cards.length)+state.cards.length)%state.cards.length;}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({activePanel:state.activePanel,indices:state.indices,lang:state.lang}));}function actionName(action){return action?.action_name||action?.name||'';}
    function createCard(panelIndex){const card=state.cards[state.indices[panelIndex]];const article=document.querySelector(`#card${panelIndex}`);if(!card||!article)return;const info=localized(card.additional_info),actions=card.actions||[];article.innerHTML='';const header=document.createElement('header');header.className='card-header';const meta=document.createElement('div');meta.className='meta';const icons=document.createElement('div');icons.className='icons';icons.setAttribute('aria-label','Kolejność frakcji');[...(card.icons||'')].forEach(code=>{const dot=document.createElement('span');dot.className=`icon icon-${code}`;dot.textContent=code;dot.title=iconNames[code]||code;dot.setAttribute('aria-label',iconNames[code]||code);icons.append(dot);});const numberArea=document.createElement('div');numberArea.className='number-area';const help=document.createElement('button');help.className='help-button';help.type='button';help.textContent='?';help.title=state.lang==='pl'?'Tło wydarzenia':'Event background';help.setAttribute('aria-label',help.title);help.addEventListener('click',()=>showFluff(panelIndex));const number=document.createElement('div');number.className='number';number.textContent=card.card_number;numberArea.append(help,number);meta.append(icons,numberArea);const titleRow=document.createElement('div');titleRow.className='title-row';const title=document.createElement('h1');title.id=`title${panelIndex}`;title.textContent=card.title||'';titleRow.append(title);header.append(meta,titleRow);article.append(header);const actionsEl=document.createElement('section');actionsEl.className='actions';actionsEl.setAttribute('aria-label','Efekty karty');actions.forEach((action,index)=>{const box=document.createElement('section');box.className=`action${index===1?' second':''}`;const name=actionName(action),text=localized(action);if(name){const heading=document.createElement('em');heading.className='action-name';heading.textContent=name;box.append(heading);}const body=document.createElement('p');body.className='action-text';body.textContent=text||(state.lang==='en'?'Translation coming soon.':'');if(!text)body.classList.add('empty-state');box.append(body);actionsEl.append(box);if(index===0&&info&&actions.length>1){const label=document.createElement('div');label.className='additional-info visible';label.textContent=info;actionsEl.append(label);}});if(info&&actions.length<=1){const label=document.createElement('div');label.className='additional-info visible';label.textContent=info;actionsEl.append(label);}article.append(actionsEl);}
    function setTrack(animate=true){track.style.transition=animate?'transform .22s ease-out':'none';track.style.transform=`translateX(${-state.activePanel*50}%)`;}function render(){if(!state.cards.length)return;state.indices=state.indices.map(wrap);createCard(0);createCard(1);setTrack();document.documentElement.lang=state.lang;document.querySelectorAll('[data-lang]').forEach(button=>button.classList.toggle('active',button.dataset.lang===state.lang));save();}
    function moveCard(amount){state.indices[state.activePanel]=wrap(state.indices[state.activePanel]+amount);render();}function switchPanel(direction){if((state.activePanel===0&&direction<0)||(state.activePanel===1&&direction>0)){state.activePanel=state.activePanel===0?1:0;render();return true;}setTrack(true);return false;}
    function showFluff(panelIndex){const card=state.cards[state.indices[panelIndex]],text=localized(card?.fluff);fluffTitle.textContent=card?.title||'';fluffContent.textContent=text||(state.lang==='pl'?'Brak tekstu tła w wybranym języku.':'No background text is available in the selected language.');fluffContent.classList.toggle('fluff-empty',!text);modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');document.querySelector('#closeFluff').focus();}function closeFluff(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');}
    document.querySelector('#prev').addEventListener('click',()=>moveCard(-1));document.querySelector('#next').addEventListener('click',()=>moveCard(1));document.querySelector('#prev10').addEventListener('click',()=>moveCard(-10));document.querySelector('#next10').addEventListener('click',()=>moveCard(10));document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{state.lang=button.dataset.lang;render();}));document.querySelector('#closeFluff').addEventListener('click',closeFluff);modal.addEventListener('click',event=>{if(event.target===modal)closeFluff();});
    let startX=0,startY=0,dragging=false;viewport.addEventListener('pointerdown',event=>{if(modal.classList.contains('open'))return;startX=event.clientX;startY=event.clientY;dragging=true;setTrack(false);viewport.setPointerCapture?.(event.pointerId);});viewport.addEventListener('pointermove',event=>{if(!dragging)return;const dx=event.clientX-startX,dy=event.clientY-startY;if(Math.abs(dx)<=Math.abs(dy)||Math.abs(dx)<8)return;event.preventDefault();const direction=dx<0?-1:1;const allowed=(state.activePanel===0&&direction<0)||(state.activePanel===1&&direction>0);const resistance=allowed?1:.23;const base=-state.activePanel*50;const percent=(dx/viewport.clientWidth)*50*resistance;track.style.transform=`translateX(${base+percent}%)`;});function endSwipe(event){if(!dragging)return;const dx=event.clientX-startX,dy=event.clientY-startY;dragging=false;const isHorizontal=Math.abs(dx)>Math.abs(dy);if(isHorizontal&&Math.abs(dx)>55)switchPanel(dx<0?-1:1);else setTrack(true);}viewport.addEventListener('pointerup',endSwipe);viewport.addEventListener('pointercancel',endSwipe);
    window.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('open')){closeFluff();return;}if(!state.cards.length||modal.classList.contains('open'))return;if(event.key==='ArrowLeft')moveCard(-1);if(event.key==='ArrowRight')moveCard(1);});
    fetch('./adp_cards.json').then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}).then(data=>{state.cards=(Array.isArray(data)?data:data.cards||[]).sort((a,b)=>a.card_number-b.card_number);if(!state.cards.length)throw new Error('Brak tablicy cards w adp_cards.json');render();}).catch(error=>{viewport.replaceWith(Object.assign(document.createElement('section'),{className:'error',innerHTML:`<strong>Nie udało się wczytać danych kart.</strong><br>Umieść plik <code>adp_cards.json</code> w tym samym katalogu na serwerze co ten plik HTML.<br><small>${error.message}</small>`}));document.querySelector('.navigation-shell').hidden=true;});
  </script>
</body>
</html>
